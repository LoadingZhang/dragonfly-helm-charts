# nydus-snapshotter Helm Chart Values
#
global:
  # -- Global Docker image registry.
  imageRegistry: ""
  # -- Global Docker registry secret names as an array.
  imagePullSecrets: []
  # -- Global node labels for pod assignment.
  nodeSelector: {}

# -- nydus-snapshotter name
name: nydus-snapshotter
image:
  # -- Image registry.
  registry: ghcr.io
  # -- Image repository.
  repository: containerd/nydus-snapshotter
  # -- Image tag.
  tag: v0.15.15
  # -- Image pull policy.
  pullPolicy: Always
  # -- Image pull secrets.
  # @default -- `[]` (defaults to global.imagePullSecrets).
  pullSecrets: []
# -- Let nydus-snapshotter run in host network
hostNetwork: true
# -- Let nydus-snapshotter use the host's pid namespace
hostPid: true
# -- Host Aliases
hostAliases: []
# -- Command to overwrite default nydus-snapshotter startup command.
command:
- bash
- -c
- |-
  /opt/nydus-artifacts/opt/nydus/snapshotter.sh deploy
# -- Args to overwrite default nydus-snapshotter startup command.
args: []
# -- Environment variables for nydus-snapshotter deployment script.
env:
  # -- Filesystem driver for nydus-snapshotter. Supported values include fusedev, fscache, blockdev and proxy.
  fsDriver: fusedev
  # -- Read nydus configuration files from the config volume mounted at /etc/nydus-snapshotter.
  enableConfigFromVolume: true
  # -- Enable runtime-specific snapshotter instead of setting containerd default snapshotter to nydus.
  enableRuntimeSpecificSnapshotter: false
  # -- Run nydus-snapshotter as a host systemd service.
  enableSystemdService: true
# -- Cleanup nydus-snapshotter and restore container runtime configuration when the pod stops.
preStopCleanup: true
# -- Pod resource requests and limits
resources:
  requests:
    cpu: "0"
    memory: "0"
  limits:
    cpu: "2"
    memory: "2Gi"
# -- Pod priorityClassName
priorityClassName: ""
# -- Node labels for pod assignment
nodeSelector: {}
# -- Pod terminationGracePeriodSeconds
terminationGracePeriodSeconds:
# -- List of node taints to tolerate
tolerations: []
# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}
# -- Daemonset annotations
daemonsetAnnotations: {}

dragonfly:
  # -- Enable dragonfly
  enable: true
  # -- Dragonfly mirror mode configuration for nydusd registry backend. Used when proxy.enable is false.
  mirrorConfig:
  - host: "http://127.0.0.1:4001"
    auth_through: false
    headers:
      "X-Dragonfly-Registry": "https://index.docker.io"
    ping_url: "http://127.0.0.1:4003/healthy"
  proxy:
    # -- Enable Dragonfly HTTP proxy mode for nydusd registry backend. If enabled, proxy.config is rendered instead of mirrorConfig.
    enable: false
    # -- Dragonfly HTTP proxy mode configuration for nydusd registry backend.
    config:
      url: "http://127.0.0.1:4001"
      fallback: true
      ping_url: "http://127.0.0.1:4003/healthy"
      check_interval: 5


# -- [Experimental] Container runtime support
# Choose special container runtime in Kubernetes.
# Support: Containerd, Docker, CRI-O
containerRuntime:
  initContainer:
    image:
      # -- Image registry.
      registry: ghcr.io
      # -- Image repository.
      repository: liubin/toml-cli
      # -- Image tag.
      tag: v0.0.7
      # -- Image pull policy.
      pullPolicy: Always

  # -- [Experimental] Containerd support
  containerd:
    # -- Enable containerd support. When installByScript is true, containerd configuration is handled by snapshotter.sh instead of the initContainer.
    # Inject nydus-snapshotter config into ${containerRuntime.containerd.configFile},
    enable: true
    # -- Configure containerd by running the nydus-snapshotter deployment script in the main container.
    installByScript: true
    # -- Custom config path directory, default is /etc/containerd/config.toml
    configFile: "/etc/containerd/config.toml"

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ template "nydus-snapshotter.fullname" . }}
  labels:
    app: {{ template "nydus-snapshotter.fullname" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: "{{ .Values.name }}"
  annotations:
    {{- if .Values.daemonsetAnnotations }}
{{ toYaml .Values.daemonsetAnnotations | indent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ template "nydus-snapshotter.fullname" . }}
      component: "{{ .Values.name }}"
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "nydus-snapshotter.fullname" . }}
        component: "{{ .Values.name }}"
        release: {{ .Release.Name }}
        {{- if .Values.podLabels }}
{{ toYaml .Values.podLabels | indent 8 }}
        {{- end }}
      {{- if .Values.podAnnotations }}
      annotations:
{{ toYaml .Values.podAnnotations | indent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{template "nydus-snapshotter.fullname" . }}-sa
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.hostNetwork }}
      hostPID: {{ .Values.hostPid }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: "ClusterFirstWithHostNet"
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}

      {{- if quote .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if and (.Capabilities.APIVersions.Has "scheduling.k8s.io/v1beta1") (.Values.priorityClassName) }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.image.pullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostAliases }}
      hostAliases:
{{ toYaml .Values.hostAliases | indent 8 }}
      {{- end }}
      containers:
      - name: nydus-snapshotter
        image: {{ template "nydus-snapshotter.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: FS_DRIVER
          value: {{ .Values.env.fsDriver | quote }}
        - name: ENABLE_CONFIG_FROM_VOLUME
          value: {{ .Values.env.enableConfigFromVolume | quote }}
        - name: ENABLE_RUNTIME_SPECIFIC_SNAPSHOTTER
          value: {{ .Values.env.enableRuntimeSpecificSnapshotter | quote }}
        - name: ENABLE_SYSTEMD_SERVICE
          value: {{ .Values.env.enableSystemdService | quote }}
        resources:
{{ toYaml .Values.resources | indent 12 }}
        {{- if .Values.preStopCleanup }}
        lifecycle:
          preStop:
            exec:
              command:
              - "bash"
              - "-c"
              - |
                /opt/nydus-artifacts/opt/nydus/snapshotter.sh cleanup
        {{- end }}
        {{- if .Values.command }}
        command:
{{ toYaml .Values.command | indent 12 }}
        {{- end }}
        {{- if .Values.args }}
        args:
{{ toYaml .Values.args | indent 12 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: "/etc/nydus-snapshotter"
        - name: nydus-lib
          mountPath: "/var/lib/containerd/io.containerd.snapshotter.v1.nydus"
          mountPropagation: Bidirectional
        - name: nydus-run
          mountPath: "/run/containerd-nydus"
          mountPropagation: Bidirectional
        - name: nydus-opt
          mountPath: "/opt/nydus"
          mountPropagation: Bidirectional
        - name: nydus-etc
          mountPath: "/etc/nydus"
          mountPropagation: Bidirectional
        - name: containerd-conf
          mountPath: "/etc/containerd/"
        - name: local-bin
          mountPath: "/usr/local/bin/"
        - name: etc-systemd-system
          mountPath: "/etc/systemd/system/"
        - name: fuse
          mountPath: "/dev/fuse"

        securityContext:
          privileged: true

      initContainers:
      {{- if and .Values.containerRuntime.containerd.enable (not .Values.containerRuntime.containerd.installByScript) }}
      - name: update-containerd
        image: {{ template "nydus-snapshotter.initContainer.image" . }}
        imagePullPolicy: {{ .Values.containerRuntime.initContainer.image.pullPolicy }}
        resources:
{{ toYaml .Values.resources | indent 12 }}
        command:
        - /bin/sh
        - -cx
        - |-
          etcContainerd={{ .Values.containerRuntime.containerd.configFile }}

          toml check $etcContainerd proxy_plugins.nydus
          if [ $? -eq 0 ]; then
            echo "nydus snapshotter has already configured."
            exit 0
          fi

          toml set --overwrite $etcContainerd plugins.\"io.containerd.grpc.v1.cri\".containerd.discard_unpacked_layers false
          toml set --overwrite $etcContainerd plugins.\"io.containerd.grpc.v1.cri\".containerd.disable_snapshot_annotations false
          toml set --overwrite $etcContainerd plugins.\"io.containerd.grpc.v1.cri\".containerd.snapshotter nydus

          # toml command not support to set block, so just use cat command.
          cat << EOF >> $etcContainerd
          [proxy_plugins]
            [proxy_plugins.nydus]
              type = "snapshot"
              address = "/run/containerd-nydus/containerd-nydus-grpc.sock"
          EOF

        volumeMounts:
        - name: containerd-conf-file
          mountPath: {{ .Values.containerRuntime.containerd.configFile }}
      {{- end }}

      volumes:
      - name: config
        configMap:
          name: {{ template "nydus-snapshotter.fullname" . }}
          optional: true
      - name: nydus-run
        hostPath:
          path: /run/containerd-nydus
          type: DirectoryOrCreate
      - name: nydus-lib
        hostPath:
          path: /var/lib/containerd/io.containerd.snapshotter.v1.nydus
          type: DirectoryOrCreate
      - name: nydus-opt
        hostPath:
          path: /opt/nydus
          type: DirectoryOrCreate
      - name: nydus-etc
        hostPath:
          path: /etc/nydus
          type: DirectoryOrCreate
      - name: containerd-conf
        hostPath:
          path: /etc/containerd/
      - name: local-bin
        hostPath:
          path: /usr/local/bin/
      - name: etc-systemd-system
        hostPath:
          path: /etc/systemd/system/
      - name: fuse
        hostPath:
          path: /dev/fuse
      {{- if and .Values.containerRuntime.containerd.enable (not .Values.containerRuntime.containerd.installByScript) }}
      - name: containerd-conf-file
        hostPath:
          path: {{ .Values.containerRuntime.containerd.configFile }}
      {{- end }}
